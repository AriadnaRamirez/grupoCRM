name: GitHub Pages

on:
  push:
    branches: [prepare-production-hosting, main, essential-core]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify site assets
        run: node scripts/check-deploy-assets.mjs
      - name: Prepare GitHub Pages bundle
        run: node scripts/prepare-github-pages.mjs
        env:
          PAGES_BASE: /grupoCRM
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
