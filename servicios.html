<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  
  
  <script>
  /* pages-base */
  /* Sync into HTML with: node scripts/inject-pages-base.mjs */
  (function () {
    if (typeof location === "undefined" || !/\.github\.io$/i.test(location.hostname)) return;
    var first = location.pathname.split("/").filter(Boolean)[0] || "grupoCRM";
    var base = "/" + first;
    if (/\.html$/i.test(location.pathname) && !/\/404\.html$/i.test(location.pathname)) {
      var clean = location.pathname.replace(/\/index\.html$/i, "/").replace(/\.html$/i, "");
      if (clean !== location.pathname) {
        location.replace(clean + location.search + location.hash);
        return;
      }
    }
    function fix(value) {
      if (!value || /^(https?:|data:|mailto:|tel:|javascript:|#)/i.test(value)) return value;
      var hashIdx = value.indexOf("#");
      var hash = hashIdx === -1 ? "" : value.slice(hashIdx);
      var before = hashIdx === -1 ? value : value.slice(0, hashIdx);
      var qIdx = before.indexOf("?");
      var search = qIdx === -1 ? "" : before.slice(qIdx);
      var pathname = qIdx === -1 ? before : before.slice(0, qIdx);
      if (pathname === "/") pathname = base + "/";
      else if (pathname.charAt(0) === "/") {
        if (!(pathname === base || pathname.indexOf(base + "/") === 0)) pathname = base + pathname;
        if (!/\/404\.html$/i.test(pathname)) {
          pathname = pathname.replace(/\/index\.html$/i, "/").replace(/\.html$/i, "");
        }
      } else {
        var rel = pathname.replace(/^\.\//, "");
        if (/^(aviso-privacidad|contacto|galeria|mapa-sitio|nosotros|producto|productos|servicios|index)\.html$/i.test(rel)) {
          var name = rel.replace(/\.html$/i, "");
          pathname = name === "index" ? base + "/" : base + "/" + name;
        } else if (/^blog\/[\w-]+\.html$/i.test(rel)) {
          pathname = base + "/" + rel.replace(/\.html$/i, "");
        } else {
          return value;
        }
      }
      return pathname + search + hash;
    }
    function apply(el) {
      if (!el || !el.getAttribute) return;
      ["href", "src", "data-bg", "data-src", "action"].forEach(function (attr) {
        var current = el.getAttribute(attr);
        if (!current) return;
        var next = fix(current);
        if (next !== current) el.setAttribute(attr, next);
      });
      ["srcset", "data-srcset"].forEach(function (attr) {
        var current = el.getAttribute(attr);
        if (!current) return;
        var next = current.split(",").map(function (part) {
          var trimmed = part.trim();
          if (!trimmed) return trimmed;
          var bits = trimmed.split(/\s+/);
          var url = bits.shift();
          var updated = fix(url);
          return bits.length ? updated + " " + bits.join(" ") : updated;
        }).join(", ");
        if (next !== current) el.setAttribute(attr, next);
      });
      var style = el.getAttribute("style");
      if (style && style.indexOf("url(") !== -1) {
        el.setAttribute(
          "style",
          style.replace(/url\((['"]?)([^'")]+)\1\)/g, function (_, quote, url) {
            return "url(" + quote + fix(url) + quote + ")";
          })
        );
      }
    }
    if (!document.querySelector("base")) {
      var tag = document.createElement("base");
      tag.href = base + "/";
      var head = document.head || document.documentElement;
      head.insertBefore(tag, head.firstChild);
    }
    function applyTree(root) {
      if (!root || root.nodeType !== 1) return;
      apply(root);
      if (root.querySelectorAll) {
        root.querySelectorAll("[href], [src], [srcset], [data-bg], [data-src], [data-srcset], [action], [style]").forEach(apply);
      }
    }
    new MutationObserver(function (records) {
      records.forEach(function (record) {
        record.addedNodes.forEach(applyTree);
      });
    }).observe(document.documentElement, { childList: true, subtree: true });
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        applyTree(document.documentElement);
      });
    } else {
      applyTree(document.documentElement);
    }
  })();
  </script>
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicios | Grupo CRM Extintores</title>
  <link rel="canonical" href="https://www.crmextintores.com/nosotros">
  <meta name="robots" content="noindex, follow">
  <script>
    (function () {
      var base = /\.github\.io$/i.test(location.hostname)
        ? "/" + (location.pathname.split("/").filter(Boolean)[0] || "grupoCRM")
        : "";
      location.replace(base + "/nosotros#servicios");
    })();
  </script>
</head>
<body>
  <p>Los servicios están en <a href="nosotros.html#servicios">Nosotros</a>.</p>
</body>
</html>
