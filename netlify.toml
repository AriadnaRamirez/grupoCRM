# Sitio estático: no instalar sharp/onnx en el build.
[build]
  command = "true"
  publish = "."

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--omit=dev --ignore-scripts"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/wordpress-export/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/wordpress-export/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/.tmp-verify/*"
  to = "/404"
  status = 404
