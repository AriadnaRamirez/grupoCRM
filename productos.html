<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catálogo de extintores y equipo contra incendio | Grupo CRM</title>
  <meta name="description" content="Más de 50 equipos: extintores, chalecos, señalamientos, gabinetes y botiquines. Cotice con Grupo CRM en CDMX y Estado de México.">
  <meta name="author" content="Grupo CRM Extintores">
  <meta name="theme-color" content="#A91430">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.crmextintores.com/productos">
  <link rel="alternate" hreflang="es-MX" href="https://www.crmextintores.com/productos">
  <link rel="alternate" hreflang="x-default" href="https://www.crmextintores.com/productos">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_MX">
  <meta property="og:site_name" content="Grupo CRM Extintores">
  <meta property="og:title" content="Catálogo de extintores y equipo contra incendio | Grupo CRM">
  <meta property="og:description" content="Más de 50 equipos: extintores, chalecos, señalamientos, gabinetes y botiquines. Cotice con Grupo CRM en CDMX y Estado de México.">
  <meta property="og:url" content="https://www.crmextintores.com/productos">
  <meta property="og:image" content="https://www.crmextintores.com/assets/img/logo-crm.png">
  <meta property="og:image:alt" content="Logotipo de Grupo CRM Extintores">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Catálogo de extintores y equipo contra incendio | Grupo CRM">
  <meta name="twitter:description" content="Más de 50 equipos: extintores, chalecos, señalamientos, gabinetes y botiquines. Cotice con Grupo CRM en CDMX y Estado de México.">
  <meta name="twitter:image" content="https://www.crmextintores.com/assets/img/logo-crm.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body data-page="productos">
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <div data-header></div>
  <main id="contenido">
  <section class="shop">
    <div class="catalog-extend catalog-picker" data-catalog-extend aria-busy="true">
      <div class="wrap">
        <div class="skel-depts" aria-hidden="true">
          <span class="skel-dept"></span><span class="skel-dept"></span><span class="skel-dept"></span>
          <span class="skel-dept"></span><span class="skel-dept"></span><span class="skel-dept"></span>
          <span class="skel-dept"></span>
        </div>
      </div>
    </div>
    <div class="shop-catalog-bar shop-catalog-bar--full">
      <div class="shop-catalog-bar__inner">
        <label class="shop-search shop-search--catalog">
          <i class="fa-solid fa-magnifying-glass shop-search__icon" aria-hidden="true"></i>
          <input type="search" data-search placeholder="Buscar extintor, señal o tipo…" aria-label="Buscar equipo para cotizar">
        </label>
        <p class="shop-count" data-count></p>
      </div>
    </div>
    <div class="wrap wrap-shop">
      <div class="shop-catalog-layout" data-catalog-layout>
        <aside class="shop-filters" data-class-panel hidden>
          <p class="shop-filters__title">Clase de fuego</p>
          <p class="shop-filters__hint">Solo extintores</p>
          <div class="shop-chips shop-chips--stack" data-class-filters hidden></div>
        </aside>
        <div class="shop-catalog-main">
          <noscript><p class="js-needed">Active JavaScript para ver el catálogo.</p></noscript>
          <div class="shop-grid shop-grid--4" data-products aria-busy="true">
            <span class="skel-card" aria-hidden="true"></span>
            <span class="skel-card" aria-hidden="true"></span>
            <span class="skel-card" aria-hidden="true"></span>
            <span class="skel-card" aria-hidden="true"></span>
            <span class="skel-card" aria-hidden="true"></span>
            <span class="skel-card" aria-hidden="true"></span>
            <span class="skel-card" aria-hidden="true"></span>
            <span class="skel-card" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </div>
  </section>
  </main>
  <div data-footer></div>
  <script type="module" src="js/main.js" onerror="document.documentElement.classList.add('is-boot-error','is-booted')"></script>
</body>
</html>
